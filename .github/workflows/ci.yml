name: Photo3D static lab checks
on:
  push:
    branches: ["feature/**"]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.mjs
      - run: node --check src/app.js && node --check src/contracts.js && node --check src/models/mediapipe.js && node --check src/visualization.js && node --check src/geometry/face-topology.js
