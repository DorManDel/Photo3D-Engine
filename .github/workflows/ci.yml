name: Photo3D static lab checks
on:
  push:
    branches: ["feature/**"]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build pure-ESM geometry package
        run: node scripts/build-face-surface-package.mjs
      - run: node --test tests/*.test.mjs
      - name: Pack independent geometry module (private, not published)
        run: mkdir -p package-artifacts && npm pack ./packages/face-surface --pack-destination package-artifacts --ignore-scripts
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: photo3d-face-surface-package
          path: package-artifacts/*.tgz
          if-no-files-found: error
      - run: node --check src/app.js && node --check src/contracts.js && node --check src/models/mediapipe.js && node --check src/visualization.js && node --check src/geometry/face-topology.js && node --check src/geometry/face-triangles.js && node --check src/geometry/surface-audit.js && node --check src/renderers/three-textured.js && node --check src/visualization/face-reference.js
